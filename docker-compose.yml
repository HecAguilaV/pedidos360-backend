services:
  postgres:
    image: postgres:16-alpine
    container_name: pedidos360-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidos360"]
      interval: 5s
      timeout: 5s
      retries: 5

  productos-service:
    build:
      context: ./productos-service
      dockerfile: Dockerfile
    container_name: pedidos360-productos-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost,http://*:4200,http://*:8080,https://*.amazonaws.com,https://*.cloudfront.net}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--Xms64m -Xmx192m -XX:+UseSerialGC -Xss512k}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pedidos-service:
    build:
      context: ./pedidos-service
      dockerfile: Dockerfile
    container_name: pedidos360-pedidos-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost,http://*:4200,http://*:8080,https://*.amazonaws.com,https://*.cloudfront.net}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--Xms64m -Xmx192m -XX:+UseSerialGC -Xss512k}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  carrito-service:
    build:
      context: ./carrito-service
      dockerfile: Dockerfile
    container_name: pedidos360-carrito-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost,http://*:4200,http://*:8080,https://*.amazonaws.com,https://*.cloudfront.net}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--Xms64m -Xmx192m -XX:+UseSerialGC -Xss512k}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notifications-service:
    build:
      context: ./notifications-service
      dockerfile: Dockerfile
    container_name: pedidos360-notifications-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost,http://*:4200,http://*:8080,https://*.amazonaws.com,https://*.cloudfront.net}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--Xms64m -Xmx192m -XX:+UseSerialGC -Xss512k}
    depends_on:
      rabbitmq:
        condition: service_healthy

  envios-service:
    build:
      context: ./envios-service
      dockerfile: Dockerfile
    container_name: pedidos360-envios-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost,http://*:4200,http://*:8080,https://*.amazonaws.com,https://*.cloudfront.net}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--Xms64m -Xmx192m -XX:+UseSerialGC -Xss512k}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pagos-service:
    build:
      context: ./pagos-service
      dockerfile: Dockerfile
    container_name: pedidos360-pagos-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pedidos360}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173,http://localhost:8080,http://localhost,http://*:4200,http://*:8080,https://*.amazonaws.com,https://*.cloudfront.net}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JDK_JAVA_OPTIONS: ${JDK_JAVA_OPTIONS:--Xms64m -Xmx192m -XX:+UseSerialGC -Xss512k}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../pedidos360-frontend}
      dockerfile: Dockerfile
    container_name: pedidos360-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${GATEWAY_PORT:-8080}:80"
    environment:
      COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_REDIRECT_URI: ${COGNITO_REDIRECT_URI:-}
      COGNITO_SCOPES: ${COGNITO_SCOPES:-openid profile email}
    depends_on:
      - pedidos-service
      - productos-service
      - carrito-service
      - notifications-service
      - envios-service
      - pagos-service

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pedidos360-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
